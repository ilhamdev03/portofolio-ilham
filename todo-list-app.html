<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List App — Ilham.dev</title>
<style>
  :root{
    --bg: #0f172a;
    --panel: rgba(30,41,59,0.6);
    --border: #1e293b;
    --border-hover: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --done: #10b981;
    --danger: #ef4444;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    padding:40px 20px;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI", Roboto, Arial, sans-serif;
    display:flex;
    justify-content:center;
  }
  .wrap{ width:100%; max-width:520px; }
  a.back{
    display:inline-block;
    margin-bottom:20px;
    font-size:0.9rem;
    color:#818cf8;
    text-decoration:none;
  }
  a.back:hover{ text-decoration:underline; }

  h1{ font-size:1.6rem; margin:0 0 4px; letter-spacing:-0.01em; }
  p.sub{ color:var(--muted); margin:0 0 26px; font-size:0.95rem; }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
  }

  .input-row{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .input-row input{
    flex:1;
    padding:11px 12px;
    border-radius:8px;
    border:1px solid var(--border-hover);
    background:var(--bg);
    color:var(--text);
    font-size:0.95rem;
  }
  .input-row input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .input-row button{
    padding:11px 18px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
  }
  .input-row button:hover{ background:var(--accent-hover); }

  .filters{
    display:flex;
    gap:6px;
    margin-bottom:16px;
  }
  .filters button{
    padding:6px 14px;
    border-radius:999px;
    border:1px solid var(--border-hover);
    background:transparent;
    color:var(--muted);
    font-size:0.8rem;
    cursor:pointer;
  }
  .filters button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  ul.list{ list-style:none; margin:0; padding:0; }
  ul.list li{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 4px;
    border-bottom:1px solid var(--border);
  }
  ul.list li:last-child{ border-bottom:none; }

  .checkbox{
    width:20px;
    height:20px;
    border-radius:6px;
    border:2px solid var(--border-hover);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:0.75rem;
    color:transparent;
  }
  .checkbox.checked{
    background:var(--done);
    border-color:var(--done);
    color:#fff;
  }

  .task-text{
    flex:1;
    font-size:0.95rem;
    word-break:break-word;
    cursor:pointer;
  }
  .task-text.done{
    color:var(--muted);
    text-decoration:line-through;
  }

  .delete-btn{
    background:transparent;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:1.1rem;
    line-height:1;
    padding:4px;
  }
  .delete-btn:hover{ color:var(--danger); }

  .empty-state{
    text-align:center;
    padding:36px 10px;
    color:#64748b;
    font-size:0.9rem;
  }

  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--border);
    font-size:0.8rem;
    color:var(--muted);
  }
  .footer-row button{
    background:transparent;
    border:none;
    color:var(--muted);
    font-size:0.8rem;
    cursor:pointer;
  }
  .footer-row button:hover{ color:var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Kembali ke portfolio</a>

  <h1>To-Do List App</h1>
  <p class="sub">Tambah, tandai selesai, dan hapus tugas. Data tersimpan otomatis di browser.</p>

  <div class="card">
    <div class="input-row">
      <input type="text" id="task-input" placeholder="Tulis tugas baru..." maxlength="120">
      <button id="add-btn">Tambah</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Semua</button>
      <button class="filter-btn" data-filter="active">Belum Selesai</button>
      <button class="filter-btn" data-filter="done">Selesai</button>
    </div>

    <ul class="list" id="task-list"></ul>
    <div class="empty-state" id="empty-state" style="display:none;">Belum ada tugas. Tambahin dulu di atas!</div>

    <div class="footer-row">
      <span id="counter">0 tugas</span>
      <button id="clear-done">Hapus yang selesai</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'todo-tasks';
  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentFilter = 'all';

  const taskInput = document.getElementById('task-input');
  const addBtn = document.getElementById('add-btn');
  const taskList = document.getElementById('task-list');
  const emptyState = document.getElementById('empty-state');
  const counter = document.getElementById('counter');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const clearDoneBtn = document.getElementById('clear-done');

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function addTask(text){
    text = text.trim();
    if(!text) return;
    tasks.unshift({ id: Date.now(), text: text, done: false });
    save();
    render();
  }

  function toggleTask(id){
    const t = tasks.find(t => t.id === id);
    if(t) t.done = !t.done;
    save();
    render();
  }

  function deleteTask(id){
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function clearDone(){
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  }

  function getFiltered(){
    if(currentFilter === 'active') return tasks.filter(t => !t.done);
    if(currentFilter === 'done') return tasks.filter(t => t.done);
    return tasks;
  }

  function render(){
    const filtered = getFiltered();
    taskList.innerHTML = '';

    if(filtered.length === 0){
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
    }

    filtered.forEach(t => {
      const li = document.createElement('li');

      const checkbox = document.createElement('div');
      checkbox.className = 'checkbox' + (t.done ? ' checked' : '');
      checkbox.textContent = t.done ? '✓' : '';
      checkbox.addEventListener('click', () => toggleTask(t.id));

      const span = document.createElement('span');
      span.className = 'task-text' + (t.done ? ' done' : '');
      span.textContent = t.text;
      span.addEventListener('click', () => toggleTask(t.id));

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.innerHTML = '&times;';
      delBtn.addEventListener('click', () => deleteTask(t.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      taskList.appendChild(li);
    });

    const remaining = tasks.filter(t => !t.done).length;
    counter.textContent = remaining + ' tugas belum selesai';
  }

  addBtn.addEventListener('click', () => {
    addTask(taskInput.value);
    taskInput.value = '';
    taskInput.focus();
  });

  taskInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      addTask(taskInput.value);
      taskInput.value = '';
    }
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  clearDoneBtn.addEventListener('click', clearDone);

  render();
</script>
</body>
</html>
